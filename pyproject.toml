[tool.poetry]
name = "kwai-collector"
version = "0.1.0"
description = "Coletor de posts e comentarios do Kwai (Desafio VoxRadar - Nivel 1)"
authors = ["Lucas Soares Rocha <109883739+Lucas7721@users.noreply.github.com>"]
readme = "README.md"
packages = [{ include = "kwai_collector" }]

[tool.poetry.dependencies]
python = "^3.11"
httpx = "^0.27"
pydantic = "^2.8"
pydantic-settings = "^2.3"
typer = "^0.16"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
respx = "^0.21"
mypy = "^1.10"
ruff = "^0.5"

[tool.poetry.scripts]
kwai-collector = "kwai_collector.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["kwai_collector"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
