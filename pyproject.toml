[tool.poetry]
name = "kwai-collector"
version = "0.1.0"
description = "Coletor de postagens, engajamento e comentarios do Kwai (Desafio VoxRadar - Nivel 2)"
authors = ["Lucas Soares Rocha <109883739+Lucas7721@users.noreply.github.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
httpx = "^0.27"
pydantic = "^2.8"
pydantic-settings = "^2.3"
tenacity = "^9.0"
typer = "^0.16"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-cov = "^5.0"
respx = "^0.21"
mypy = "^1.10"
ruff = "^0.5"

[tool.poetry.scripts]
kwai-collector = "src.__main__:app"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.bak-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ANN", "D"]
ignore = ["E501", "ANN401", "ANN101", "ANN102", "D105"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
